[package]
name = "lattice-node"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
[dependencies]
lattice-wasm = {path = "../lattice-rs/crates/lattice-wasm"}
lattice-light-client = {path = "../lattice-light-client-rs"}
form_urlencoded = "1"
sha2 = "0.10"
num-bigint = "0.4"
ivy = {path = "../ivy-rs/crates/ivy"}
ivy-core = {path = "../ivy-rs/crates/ivy-core"}
ivy-tally = {path = "../ivy-rs/crates/ivy-tally"}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"]}
axum = "0.8"
ed25519-dalek = {version = "2", features = ["rand_core"]}
rand_core = {version = "0.6", features = ["getrandom"]}
hex = "0.4"
anyhow = "1"
lattice-pow = {path = "../lattice-rs/crates/lattice-pow"}
lattice-validation = {path = "../lattice-rs/crates/lattice-validation"}
lattice-block-tree = {path = "../lattice-rs/crates/lattice-block-tree"}
lattice-primitives = {path = "../lattice-rs/crates/lattice-primitives"}
lattice-cashew = {path = "../cashew-rs"}
lattice-volume-broker = {path = "../volume-broker-rs"}
lattice-tally = {path = "../tally-rs"}
rusqlite = {version = "0.38", features = ["bundled"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
base64 = "0.22"
[dev-dependencies]
tempfile = "3"
cid = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
